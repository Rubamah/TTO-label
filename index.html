<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queue System</title>

<style>
body {
  font-family: Arial;
  text-align: center;
}

/* TABS */
.tab {
  display: none;
}

.active {
  display: block;
}

/* INPUTS */
input {
  padding: 10px;
  margin: 5px;
  width: 220px;
  font-size: 16px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
}

/* LABEL */
#label {
  width: 90mm;
  height: 55mm;
  padding: 4mm;
  box-sizing: border-box;
  text-align: center;
  margin-left: 14mm;
}

.title {
  font-size: 12px;
  font-weight: bold;
}

.queue {
  font-size: 50px;
  font-weight: 900;
  margin: 5px 0;
}

.mrn {
  font-size: 14px;
}

/* LIST TAB */
#mrnList {
  margin-top: 20px;
}

.mrn-item {
  color: green;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
}

.mrn-item.done {
  color: black;
}

@media print {
  body * {
    visibility: hidden;
  }

  #label,
  #label * {
    visibility: visible;
  }

  #label {
    position: absolute;
    top: 0;
    left: 0;
  }
}
</style>
</head>

<body>

<h3>Queue System</h3>

<button onclick="openTab('noMRN')">No MRN</button>
<button onclick="openTab('withMRN')">With MRN</button>
<button onclick="openTab('list')">List</button>

<!-- NO MRN -->
<div id="noMRN" class="tab active">
  <input type="number" id="q1" placeholder="Queue Number">
  <br>
  <button onclick="printNoMRN()">Print</button>
  <button onclick="nextNoMRN()">Next</button>
</div>

<!-- WITH MRN -->
<div id="withMRN" class="tab">
  <input type="number" id="q2" placeholder="Queue Number">
  <br>
  <input type="text" id="mrn" placeholder="MRN (Required)">
  <br>
  <button onclick="printMRN()">Print</button>
  <button onclick="nextMRN()">Next</button>
</div>

<!-- LIST -->
<div id="list" class="tab">
  <h3>MRN List</h3>

  <input type="text" id="listMRN" placeholder="Enter MRN">
  <br>
  <button onclick="addMRNToList()">Add MRN</button>

  <div id="mrnList"></div>
</div>

<!-- LABEL -->
<div id="label">
  <div class="title">Patient is here</div>
  <div class="queue" id="printQueue"></div>
  <div class="mrn" id="printMRN"></div>
</div>

<script>
let lastPrinted = null;

// TAB SWITCH
function openTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}

// PRINT CORE
function printLabel(q, m = "") {
  document.getElementById("printQueue").innerText = q;
  document.getElementById("printMRN").innerText = m ? "MRN: " + m : "";
  window.print();
  lastPrinted = parseInt(q);
}

/* ======================
   NO MRN
====================== */

function printNoMRN() {
  let q = document.getElementById("q1").value;

  if (!q) {
    alert("Enter queue");
    return;
  }

  printLabel(q);
}

function nextNoMRN() {
  if (lastPrinted === null) {
    alert("Print first");
    return;
  }

  let next = lastPrinted + 1;

  printLabel(next);
  document.getElementById("q1").value = next;
}

/* ======================
   WITH MRN
====================== */

function printMRN() {
  let q = document.getElementById("q2").value;
  let m = document.getElementById("mrn").value;

  if (!q || !m) {
    alert("MRN required");
    return;
  }

  printLabel(q, m);
}

function nextMRN() {
  let qField = document.getElementById("q2");
  let mField = document.getElementById("mrn");

  if (!qField.value) {
    alert("Enter queue first");
    return;
  }

  let next = parseInt(qField.value) + 1;

  qField.value = next;
  mField.value = "";
}

/* ======================
   MRN LIST
====================== */

function addMRNToList() {
  let field = document.getElementById("listMRN");
  let mrn = field.value.trim();

  if (!mrn) {
    alert("Enter MRN");
    return;
  }

  let item = document.createElement("div");

  item.className = "mrn-item";
  item.innerText = mrn;

  item.onclick = function() {
    item.classList.toggle("done");
  };

  document.getElementById("mrnList").appendChild(item);

  field.value = "";
}
</script>

</body>
</html>
